# Configuración del build, versionada en el repositorio en lugar de
# depender del panel: así sobrevive a que se rehaga el sitio y sirve
# de documentación de cómo se construye esto.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 exige Node >= 22.12. Sin fijarlo, el build depende de la
  # versión por defecto del proveedor, que cambia sin avisar.
  NODE_VERSION = "22"
